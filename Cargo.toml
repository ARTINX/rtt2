[package]
name = "rtt2"
version = "1.1.0"
edition = "2024"
description = "Windows SEGGER RTT telemetry monitor and one-shot command client"
repository = "https://mirrors.sustech.edu.cn/git/artinx_eee/artinx_core/rtt2"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.37.0"
probe-rs = "0.32.0"
rfd = "0.15.4"
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
