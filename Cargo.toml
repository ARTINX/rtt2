[package]
name = "rtt2"
version = "1.4.0"
edition = "2024"
description = "Cross-platform SEGGER RTT monitor with a shared GUI and interactive CLI"
repository = "https://github.com/hyj0824/rtt2"
readme = "README.md"
publish = false

[dependencies]
egui_plot = { version = "0.37.0", optional = true }
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "std"] }
probe-rs = "0.32.0"
rfd = { version = "0.15.4", optional = true }
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Only tests build ELF fixtures from scratch; the binary only reads them.
[dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["write"] }

[features]
# GUI is opt-out: `cargo build --no-default-features` produces a CLI-only binary
# without pulling eframe/egui/rfd/winit.
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd", "dep:winit"]

# Keep the GUI dependency minimal. Linux needs an explicit winit backend:
# disabling eframe's defaults also disables winit/default (X11/Wayland/dlopen).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
winit = { version = "0.30.13", default-features = true, optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
